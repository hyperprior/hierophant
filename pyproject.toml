[project]
name = "hierophant"
version = "0.2.0.dev0"
description = "Explanations of ML models, written by an LLM and checked against the model."
readme = "README.md"
license = "MIT"
authors = [{ name = "hyperprior" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "shap>=0.46",
]

[project.urls]
Repository = "https://github.com/hyperprior/hierophant"
Lab = "https://hyperprior.institute/labs/hierophant/"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["network: downloads data (deselect with -m 'not network')"]
addopts = "-m 'not network'"
